<meta charset="UTF-8">

<title>404 — Submarine Catalyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#040d1a; --deep:#07152b; --surface:#0b1f3a; --border:#1a3a5c; --accent:#00d4ff; --accent2:#00ff9d; --text:#c8dff0; --muted:#5a7a99; --white:#eaf4ff; --mono:'Space Mono',monospace; --serif:'DM Serif Display',serif; --sans:'DM Sans',sans-serif; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--navy);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
  .code{font-family:var(--mono);font-size:clamp(5rem,16vw,8rem);font-weight:600;letter-spacing:-0.04em;line-height:1;margin-bottom:1rem;background:linear-gradient(180deg,rgba(34,211,238,0.55),rgba(34,211,238,0.05));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .title{font-family:var(--serif);font-size:2rem;font-weight:600;letter-spacing:-0.03em;color:var(--white);margin-bottom:0.75rem;}
  .sub{font-size:1rem;color:var(--muted);margin-bottom:2.25rem;max-width:420px;line-height:1.7;}
  .actions{display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center;}
  .back{font-family:var(--sans);font-size:0.92rem;font-weight:600;color:#03141b;background:var(--accent);text-decoration:none;border-radius:10px;padding:0.75rem 1.4rem;transition:filter 0.2s,transform 0.2s;}
  .back:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .back.ghost{color:var(--text);background:transparent;border:1px solid var(--hairline);}
  .back.ghost:hover{color:var(--white);border-color:rgba(148,163,184,0.35);}
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#050a14">
<link rel="stylesheet" href="/css/sc-theme.css?v=1">
<script src="/js/sc-ui.js?v=1" defer></script>
</head>
<body>
  <div class="code">404</div>
  <h1 class="title">Signal lost.</h1>
  <p class="sub">The page you're looking for doesn't exist or has been moved. Check the URL or head back to the surface.</p>
  <div class="actions">
    <a href="/" class="back">← Return to base</a>
    <a href="/calendar.html" class="back ghost">Catalyst calendar</a>
  </div>
</body>
</html>
